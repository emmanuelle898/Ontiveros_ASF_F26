<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Menu | The Crimson Hound Foundry</title>

    <meta name="description" content="Browse breakfast, lunch, and dinner at The Crimson Hound Foundry.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <script src="js/script.js" defer></script>

  </head>

  <body class="menu-page">

    <header>

      <nav class="navbar navbar-expand-lg foundry-navbar" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img class="navbar-logo" src="images/logo.png" alt="Crimson Hound logo">
            <span>The Crimson Hound Foundry</span>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-navigation">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Landing</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="reservations.html">Reservations</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <section class="page-panel text-center mb-4">
        <p class="eyebrow">Breakfast | Lunch | Dinner</p>
        <h1>The Crimson Hound Menu</h1>

      </section>

      <section class="page-panel menu-section" >
        <div class="row justify-content-center mb-4">
          <div class="col-12 col-md-6 col-lg-4">
            <h2 id="menu-filter-heading" class="h4">Filter the Menu</h2>
            <label class="form-label" for="category-filter">Meal category</label>
            <select class="form-select" id="category-filter">
              <option value="All">All Categories</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
            </select>
          </div>
        </div>

        <p id="menu-message" class="text-center">Loading the menu...</p>

        <article id="menu-card" class="card menu-card mx-auto" hidden>
          <div class="row g-0">
            <div class="col-12 col-lg-7">
              <img id="menu-image" class="menu-card-image" src="images/forge-burger.png" alt="">
            </div>
            <div class="col-12 col-lg-5 d-flex">
              <div class="card-body d-flex flex-column justify-content-center">
                <p id="menu-category" class="menu-category"></p>
                <h2 id="menu-name" class="card-title"></h2>
                <p id="menu-description" class="card-text"></p>
                <p id="menu-price" class="menu-price"></p>
                <p id="menu-position" class="small text-light-emphasis mb-0"></p>
              </div>
            </div>
          </div>
        </article>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <button id="prev-button" class="btn btn-outline-light" type="button">PREV</button>
          <button id="next-button" class="btn btn-foundry" type="button">NEXT</button>
        </div>


      </section>
    </main>

    <footer>
      <p>&copy; 49 ABY The Crimson Hound Foundry</p>
    </footer>
  </body>
</html>
